<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador e Renderizador de Legendas em Vídeo</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #1a73e8; margin-top: 0; }
    
    .ad-banner {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-decoration: none;
      display: block;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.16);
      transition: transform 0.2s;
    }
    .ad-banner:hover { transform: scale(1.02); }

    input[type="file"] { margin: 15px 0; padding: 10px; border: 1px solid #ccc; border-radius: 6px; width: 100%; max-width: 400px; }
    video, canvas { width: 100%; max-width: 600px; border-radius: 8px; margin-top: 15px; display: none; }
    
    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background-color: #1557b0; }
    .btn-green { background-color: #28a745; }
    .btn-green:hover { background-color: #218838; }

    #subtitlesBox {
      width: 100%;
      height: 100px;
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }
    #statusText { margin-top: 15px; font-weight: bold; color: #1a73e8; font-size: 16px; }
    #downloadArea { display: none; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gerador de Legendas em Vídeo com IA</h1>
    <p>Envie o seu vídeo para transcrever o áudio e embutir as legendas!</p>

    <!-- BANNER MONETAG -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner">
      🎁 Clique aqui para conferir ofertas exclusivas e apoiar o site!
    </a>

    <input type="file" id="videoInput" accept="video/*">
    <br>

    <video id="videoPlayer" controls></video>
    <canvas id="videoCanvas"></canvas>

    <div style="margin-top: 20px;">
      <button class="btn" onclick="transcreverAudioReal()">🎙️ 1. Transcrever Áudio do Vídeo</button>
      <button class="btn btn-green" onclick="gerarEVideolegenda()">🎬 2. Gerar Vídeo com Legendas</button>
    </div>

    <p id="statusText"></p>
    <textarea id="subtitlesBox" placeholder="O texto transcrito do áudio do seu vídeo aparecerá aqui para você editar se quiser..."></textarea>

    <div id="downloadArea">
      <button class="btn btn-green" onclick="baixarVideoComLegenda()">📥 Baixar Vídeo Legendado (MP4/WebM)</button>
    </div>

    <!-- BANNER MONETAG RODAPÉ -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner" style="background: linear-gradient(135deg, #4caf50, #388e3c); margin-top: 30px;">
      ⚡ Baixar Pacote de Ferramentas Premium
    </a>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const videoPlayer = document.getElementById('videoPlayer');
    const videoCanvas = document.getElementById('videoCanvas');
    const ctx = videoCanvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const subtitlesBox = document.getElementById('subtitlesBox');
    const downloadArea = downloadArea = document.getElementById('downloadArea');
    const directLink = "https://uplcm.com/4/11875710";

    let mediaRecorder;
    let recordedChunks = [];
    let processedVideoBlob = null;

    videoInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        videoPlayer.src = fileURL;
        videoPlayer.style.display = 'block';
        videoCanvas.style.display = 'none';
        downloadArea.style.display = 'none';
        subtitlesBox.value = '';
        statusText.innerText = '';
      }
    });

    // Função para escutar o áudio do vídeo usando o Reconhecimento de Voz nativo
    function transcreverAudioReal() {
      window.open(directLink, '_blank');

      if (!videoInput.files[0]) {
        alert('Por favor, selecione um arquivo de vídeo primeiro!');
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Seu navegador não suporta a transcrição nativa. Digite o texto da legenda na caixa abaixo!');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = true;
      recognition.interimResults = true;

      statusText.innerText = "🎙️ Reproduzindo vídeo e escutando o áudio em Português...";
      subtitlesBox.value = "";

      videoPlayer.currentTime = 0;
      videoPlayer.play();
      recognition.start();

      recognition.onresult = function(event) {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        subtitlesBox.value = transcript;
      };

      videoPlayer.onended = function() {
        recognition.stop();
        statusText.innerText = "✅ Transcrição do áudio concluída! Se desejar, faça ajustes no texto acima e clique no botão '2. Gerar Vídeo com Legendas'.";
      };

      recognition.onerror = function() {
        statusText.innerText = "⚠️ Dica: Ajuste o texto da legenda na caixa e clique no botão '2. Gerar Vídeo com Legendas'.";
      };
    }

    // Função para desenhar o texto quebrando linhas automaticamente
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let lines = [];

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = context.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      // Desenha fundo e linhas
      const startY = y - (lines.length - 1) * lineHeight;
      for (let k = 0; k < lines.length; k++) {
        let currentText = lines[k].trim();
        let textWidth = context.measureText(currentText).width;

        context.fillStyle = "rgba(0, 0, 0, 0.75)";
        context.fillRect(x - (textWidth / 2) - 10, startY + (k * lineHeight) - lineHeight + 6, textWidth + 20, lineHeight);

        context.fillStyle = "#FFEB3B";
        context.fillText(currentText, x, startY + (k * lineHeight));
      }
    }

    function renderFrame() {
      if (videoPlayer.paused || videoPlayer.ended) return;

      videoCanvas.width = videoPlayer.videoWidth || 640;
      videoCanvas.height = videoPlayer.videoHeight || 360;

      ctx.drawImage(videoPlayer, 0, 0, videoCanvas.width, videoCanvas.height);

      const texto = subtitlesBox.value.trim() || "Vídeo Legendado";
      const fontSize = Math.floor(videoCanvas.height * 0.05);
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;
      ctx.textAlign = "center";

      const x = videoCanvas.width / 2;
      const y = videoCanvas.height - (fontSize * 2);
      const maxWidth = videoCanvas.width * 0.85; // Limita a 85% da largura da tela

      wrapText(ctx, texto, x, y, maxWidth, fontSize + 8);

      requestAnimationFrame(renderFrame);
    }

    async function gerarEVideolegenda() {
      window.open(directLink, '_blank');

      if (!videoInput.files[0]) {
        alert('Por favor, selecione um arquivo de vídeo primeiro!');
        return;
      }

      statusText.innerText = "⏳ Renderizando vídeo com as legendas ajustadas... Aguarde!";
      videoPlayer.style.display = 'none';
      videoCanvas.style.display = 'block';

      videoPlayer.currentTime = 0;
      recordedChunks = [];

      const stream = videoCanvas.captureStream(30);
      if (videoPlayer.captureStream || videoPlayer.mozCaptureStream) {
        const audioStream = (videoPlayer.captureStream || videoPlayer.mozCaptureStream).call(videoPlayer);
        audioStream.getAudioTracks().forEach(track => stream.addTrack(track));
      }

      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        processedVideoBlob = new Blob(recordedChunks, { type: 'video/webm' });
        statusText.innerText = "✅ Vídeo legendado com sucesso!";
        downloadArea.style.display = 'block';
      };

      videoPlayer.play();
      mediaRecorder.start();
      renderFrame();

      videoPlayer.onended = function() {
        mediaRecorder.stop();
      };
    }

    function baixarVideoComLegenda() {
      window.open(directLink, '_blank');

      if (!processedVideoBlob) {
        alert('Nenhum vídeo processado disponível!');
        return;
      }

      const url = URL.createObjectURL(processedVideoBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'video_legendado.mp4';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>

</body>
</html>
