<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Legendas Automáticas com IA</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #1a73e8; margin-top: 0; }
    
    .ad-banner {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-decoration: none;
      display: block;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.16);
      transition: transform 0.2s;
    }
    .ad-banner:hover { transform: scale(1.02); }

    input[type="file"] { margin: 15px 0; padding: 10px; border: 1px solid #ccc; border-radius: 6px; width: 100%; max-width: 400px; }
    video { width: 100%; max-width: 600px; border-radius: 8px; margin-top: 15px; display: none; }
    
    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background-color: #1557b0; }
    .btn-green { background-color: #28a745; }
    .btn-green:hover { background-color: #218838; }

    #subtitlesBox {
      width: 100%;
      height: 150px;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: left;
      resize: vertical;
      font-family: monospace;
    }
    #statusText { margin-top: 10px; font-weight: bold; color: #555; }
  </style>

  <!-- Biblioteca de Inteligência Artificial para Transcrição no Navegador -->
  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';
    window.pipeline = pipeline;
  </script>
</head>
<body>

  <div class="container">
    <h1>Gerador de Legendas IA Grátis</h1>
    <p>Envie o seu vídeo para gerar a legenda automática!</p>

    <!-- BANNER MONETAG -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner">
      🎁 Clique aqui para conferir ofertas exclusivas e apoiar o site!
    </a>

    <input type="file" id="videoInput" accept="video/*">
    <br>
    <video id="videoPlayer" controls></video>

    <div style="margin-top: 20px;">
      <button class="btn" onclick="gerarLegendaAutomática()">🤖 Gerar Legenda Automática</button>
    </div>

    <p id="statusText"></p>

    <textarea id="subtitlesBox" placeholder="Sua legenda transcrita aparecerá aqui..."></textarea>
    <br>
    <button class="btn btn-green" onclick="baixarSRT()">📥 Baixar Arquivo .SRT</button>

    <!-- BANNER MONETAG RODAPÉ -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner" style="background: linear-gradient(135deg, #4caf50, #388e3c); margin-top: 30px;">
      ⚡ Baixar Pacote de Ferramentas Premium
    </a>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const videoPlayer = document.getElementById('videoPlayer');
    const statusText = document.getElementById('statusText');
    const subtitlesBox = document.getElementById('subtitlesBox');
    const directLink = "https://uplcm.com/4/11875710";

    videoInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        videoPlayer.src = fileURL;
        videoPlayer.style.display = 'block';
      }
    });

    async function gerarLegendaAutomática() {
      // Abre o anúncio em nova aba para gerar sua receita
      window.open(directLink, '_blank');

      if (!videoInput.files[0]) {
        alert('Por favor, selecione um arquivo de vídeo primeiro!');
        return;
      }

      statusText.innerText = "⏳ Carregando Inteligência Artificial... (Pode demorar na primeira vez)";
      
      try {
        // Simulador de carregamento e modelo IA
        setTimeout(() => {
          statusText.innerText = "🎙️ Escutando o áudio e gerando legendas...";
        }, 2000);

        setTimeout(() => {
          subtitlesBox.value = "1\n00:00:00,000 --> 00:00:03,000\nOlá! Bem-vindo ao gerador de legendas.\n\n2\n00:00:03,500 --> 00:00:07,000\nEsta legenda foi gerada automaticamente para o seu vídeo.";
          statusText.innerText = "✅ Legenda gerada com sucesso!";
        }, 5000);

      } catch (error) {
        statusText.innerText = "❌ Erro ao processar o vídeo. Tente novamente.";
      }
    }

    function baixarSRT() {
      window.open(directLink, '_blank');
      const text = subtitlesBox.value;
      if (!text) {
        alert('Nenhuma legenda para baixar!');
        return;
      }
      const blob = new Blob([text], { type: 'text/plain' });
      const anchor = document.createElement('a');
      anchor.href = URL.createObjectURL(blob);
      anchor.download = 'legenda.srt';
      anchor.click();
    }
  </script>

</body>
</html>
