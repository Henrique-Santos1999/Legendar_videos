<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferramentas Web Práticas - Contador & Link WhatsApp</title>
  <meta name="description" content="Ferramentas gratuitas online: conte caracteres e crie links diretos para o WhatsApp com mensagens personalizadas.">

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; margin: 0; padding: 15px; }
    .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    
    h1 { color: #1a73e8; margin-top: 0; font-size: 22px; text-align: center; }

    /* Banners Monetag */
    .ad-banner {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
      text-decoration: none;
      display: block;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .ad-banner:hover { transform: scale(1.01); }

    /* Abas de Navegação */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #e9ecef;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      color: #555;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #1a73e8;
      color: #fff;
    }

    /* Conteúdo das Abas */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Contador */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    @media(min-width: 500px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .stat-card {
      background: #f8f9fa;
      border: 1px solid #e1e4e8;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card span { display: block; font-size: 18px; font-weight: bold; color: #1a73e8; }
    .stat-card label { font-size: 11px; color: #666; }

    textarea, input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }
    textarea { height: 150px; resize: vertical; }
    textarea:focus, input:focus { border-color: #1a73e8; }

    /* Botões */
    .actions-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }
    .btn-green { background-color: #25d366; color: #fff; }
    .btn-green:hover { background-color: #1ebc57; }
    .btn-gray { background-color: #6c757d; }

    .result-box {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      word-break: break-all;
    }

    footer { text-align: center; margin-top: 25px; font-size: 12px; color: #888; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Ferramentas Web Práticas</h1>

    <!-- BANNER MONETAG TOPO -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner">
      🎁 Ofertas Exclusivas e Ferramentas Premium
    </a>

    <!-- ABAS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="trocarAba('contador')">📝 Contador de Texto</button>
      <button class="tab-btn" onclick="trocarAba('whatsapp')">💬 Link do WhatsApp</button>
    </div>

    <!-- ABA 1: CONTADOR DE CARACTERES -->
    <div id="tab-contador" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <span id="charCount">0</span>
          <label>Caracteres</label>
        </div>
        <div class="stat-card">
          <span id="charNoSpaceCount">0</span>
          <label>Sem Espaços</label>
        </div>
        <div class="stat-card">
          <span id="wordCount">0</span>
          <label>Palavras</label>
        </div>
        <div class="stat-card">
          <span id="readingTime">0s</span>
          <label>Tempo Leitura</label>
        </div>
      </div>

      <textarea id="textInput" placeholder="Cole ou digite seu texto aqui..." oninput="atualizarEstatisticas()"></textarea>

      <div class="actions-panel">
        <button class="btn" onclick="converterMaiusculas()">MAIÚSCULAS</button>
        <button class="btn" onclick="converterMinusculas()">minúsculas</button>
        <button class="btn btn-green" onclick="copiarTexto()">📋 Copiar Texto</button>
        <button class="btn btn-gray" onclick="limparTexto()">🗑️ Limpar</button>
      </div>
    </div>

    <!-- ABA 2: GERADOR DE LINK DO WHATSAPP -->
    <div id="tab-whatsapp" class="tab-content">
      <label style="font-weight: bold; display: block; margin-bottom: 5px;">Número do WhatsApp (com DDD):</label>
      <input type="tel" id="waPhone" placeholder="Ex: 11999998888" oninput="gerarLinkWhatsApp()">

      <label style="font-weight: bold; display: block; margin-bottom: 5px;">Mensagem Inicial (Opcional):</label>
      <textarea id="waMessage" placeholder="Ex: Olá! Vi seu anúncio e gostaria de mais informações." oninput="gerarLinkWhatsApp()" style="height: 100px;"></textarea>

      <div class="result-box">
        <label style="font-weight: bold; color: #2e7d32; display: block; margin-bottom: 5px;">Seu Link Gerado:</label>
        <input type="text" id="waResult" readonly placeholder="O link aparecerá aqui..." style="background: #fff; margin-bottom: 0;">
      </div>

      <div class="actions-panel" style="margin-top: 15px;">
        <button class="btn btn-green" onclick="copiarLinkWhatsApp()">📋 Copiar Link</button>
        <button class="btn" onclick="abrirWhatsApp()">🚀 Testar no WhatsApp</button>
      </div>
    </div>

    <!-- BANNER MONETAG RODAPÉ -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner" style="background: linear-gradient(135deg, #4caf50, #388e3c); margin-top: 25px;">
      ⚡ Acessar Ferramentas VIP Recomendadas
    </a>

    <footer>
      &copy; 2026 • Ferramentas Gratuitas Online
    </footer>
  </div>

  <script>
    const directLink = "https://uplcm.com/4/11875710";

    // Troca de Abas
    function trocarAba(nomeAba) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (nomeAba === 'contador') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-contador').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-whatsapp').classList.add('active');
        gerarLinkWhatsApp();
      }
    }

    // Lógica do Contador
    const textInput = document.getElementById('textInput');
    function atualizarEstatisticas() {
      const texto = textInput.value;
      document.getElementById('charCount').innerText = texto.length;
      document.getElementById('charNoSpaceCount').innerText = texto.replace(/\s/g, '').length;
      
      const palavras = texto.trim() === '' ? 0 : texto.trim().split(/\s+/).length;
      document.getElementById('wordCount').innerText = palavras;

      const segundos = Math.ceil((palavras / 200) * 60);
      document.getElementById('readingTime').innerText = segundos < 60 ? segundos + "s" : (segundos / 60).toFixed(1) + "m";
    }

    function converterMaiusculas() { textInput.value = textInput.value.toUpperCase(); atualizarEstatisticas(); }
    function converterMinusculas() { textInput.value = textInput.value.toLowerCase(); atualizarEstatisticas(); }
    function limparTexto() { textInput.value = ''; atualizarEstatisticas(); }
    
    function copiarTexto() {
      if (!textInput.value) return alert('Digite ou cole algum texto para copiar!');
      textInput.select();
      textInput.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        alert('Texto copiado com sucesso!');
      } catch (err) {
        navigator.clipboard.writeText(textInput.value);
        alert('Texto copiado com sucesso!');
      }
      window.open(directLink, '_blank');
    }

    // Lógica do Gerador de Link do WhatsApp
    function gerarLinkWhatsApp() {
      let phone = document.getElementById('waPhone').value.replace(/\D/g, '');
      const message = document.getElementById('waMessage').value;

      if (phone) {
        // Se a pessoa não digitar o 55 do Brasil, adiciona automaticamente
        if (phone.length <= 11 && !phone.startsWith('55')) {
          phone = '55' + phone;
        }
        let url = `https://wa.me/${phone}`;
        if (message.trim()) {
          url += `?text=${encodeURIComponent(message)}`;
        }
        document.getElementById('waResult').value = url;
      } else {
        document.getElementById('waResult').value = '';
      }
    }

    function copiarLinkWhatsApp() {
      const resultInput = document.getElementById('waResult');
      if (!resultInput.value) return alert('Digite o número do WhatsApp primeiro!');
      
      resultInput.select();
      resultInput.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        alert('Link do WhatsApp copiado para a área de transferência!');
      } catch (err) {
        navigator.clipboard.writeText(resultInput.value);
        alert('Link do WhatsApp copiado com sucesso!');
      }
      window.open(directLink, '_blank');
    }

    function abrirWhatsApp() {
      const url = document.getElementById('waResult').value;
      if (!url) return alert('Digite o número do WhatsApp primeiro!');
      
      // Abre o WhatsApp
      window.open(url, '_blank');
      // Abre a monetização
      window.open(directLink, '_blank');
    }
  </script>

</body>
</html>
