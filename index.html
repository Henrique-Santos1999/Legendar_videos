<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferramentas Web Práticas - Contador & QR Code Pix</title>
  <meta name="description" content="Ferramentas gratuitas online: conte caracteres e crie códigos QR Code instantaneamente para redes sociais, PIX e links.">
  
  <!-- Biblioteca de QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; margin: 0; padding: 15px; }
    .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    
    h1 { color: #1a73e8; margin-top: 0; font-size: 22px; text-align: center; }

    /* Banners Monetag */
    .ad-banner {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
      text-decoration: none;
      display: block;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .ad-banner:hover { transform: scale(1.01); }

    /* Abas de Navegação */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #e9ecef;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      color: #555;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #1a73e8;
      color: #fff;
    }

    /* Conteúdo das Abas */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Contador */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    @media(min-width: 500px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .stat-card {
      background: #f8f9fa;
      border: 1px solid #e1e4e8;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card span { display: block; font-size: 18px; font-weight: bold; color: #1a73e8; }
    .stat-card label { font-size: 11px; color: #666; }

    textarea, input[type="text"], select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      margin-bottom: 10px;
    }
    textarea { height: 180px; resize: vertical; }
    textarea:focus, input[type="text"]:focus { border-color: #1a73e8; }

    /* QR Code */
    #qrcode-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #qrcode canvas, #qrcode img {
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    /* Botões */
    .actions-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }
    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }
    .btn-green { background-color: #28a745; }
    .btn-gray { background-color: #6c757d; }

    footer { text-align: center; margin-top: 25px; font-size: 12px; color: #888; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Ferramentas Web Práticas</h1>

    <!-- BANNER MONETAG TOPO -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner">
      🎁 Ofertas Exclusivas e Ferramentas Premium
    </a>

    <!-- ABAS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="trocarAba('contador')">📝 Contador de Texto</button>
      <button class="tab-btn" onclick="trocarAba('qrcode')">📱 Gerador QR Code</button>
    </div>

    <!-- ABA 1: CONTADOR DE CARACTERES -->
    <div id="tab-contador" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <span id="charCount">0</span>
          <label>Caracteres</label>
        </div>
        <div class="stat-card">
          <span id="charNoSpaceCount">0</span>
          <label>Sem Espaços</label>
        </div>
        <div class="stat-card">
          <span id="wordCount">0</span>
          <label>Palavras</label>
        </div>
        <div class="stat-card">
          <span id="readingTime">0s</span>
          <label>Tempo Leitura</label>
        </div>
      </div>

      <textarea id="textInput" placeholder="Cole ou digite seu texto aqui..." oninput="atualizarEstatisticas()"></textarea>

      <div class="actions-panel">
        <button class="btn" onclick="converterMaiusculas()">MAIÚSCULAS</button>
        <button class="btn" onclick="converterMinusculas()">minúsculas</button>
        <button class="btn btn-green" onclick="copiarTexto()">📋 Copiar Texto</button>
        <button class="btn btn-gray" onclick="limparTexto()">🗑️ Limpar</button>
      </div>
    </div>

    <!-- ABA 2: GERADOR DE QR CODE E PIX -->
    <div id="tab-qrcode" class="tab-content">
      <label style="font-weight: bold; display: block; margin-bottom: 5px;">Tipo de QR Code:</label>
      <select id="qrType" onchange="alternarTipoQR()">
        <option value="link">Link de Site ou WhatsApp</option>
        <option value="pix">QR Code PIX (Para Pagamentos)</option>
      </select>

      <!-- CAMPOS PARA LINK COMUM -->
      <div id="campoLink">
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Cole a URL ou Link:</label>
        <input type="text" id="qrInput" placeholder="Ex: https://seusite.com ou link do WhatsApp" oninput="gerarQRCode()">
      </div>

      <!-- CAMPOS PARA PIX -->
      <div id="campoPix" style="display: none;">
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Chave PIX (CPF, Telefone, E-mail ou Aleatória):</label>
        <input type="text" id="pixKey" placeholder="Digite sua chave PIX aqui" oninput="gerarQRCode()">

        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Nome do Recebedor:</label>
        <input type="text" id="pixName" placeholder="Ex: João da Silva" oninput="gerarQRCode()">

        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Cidade:</label>
        <input type="text" id="pixCity" placeholder="Ex: Sao Paulo" value="SAO PAULO" oninput="gerarQRCode()">
      </div>

      <div id="qrcode-container">
        <div id="qrcode"></div>
      </div>

      <div class="actions-panel" style="margin-top: 20px;">
        <button class="btn btn-green" onclick="baixarQRCode()">📥 Baixar Imagem do QR Code</button>
      </div>
    </div>

    <!-- BANNER MONETAG RODAPÉ -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner" style="background: linear-gradient(135deg, #4caf50, #388e3c); margin-top: 25px;">
      ⚡ Acessar Ferramentas VIP Recomendadas
    </a>

    <footer>
      &copy; 2026 • Ferramentas Gratuitas Online
    </footer>
  </div>

  <script>
    const directLink = "https://uplcm.com/4/11875710";

    function trocarAba(nomeAba) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (nomeAba === 'contador') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-contador').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-qrcode').classList.add('active');
        gerarQRCode();
      }
    }

    const textInput = document.getElementById('textInput');
    function atualizarEstatisticas() {
      const texto = textInput.value;
      document.getElementById('charCount').innerText = texto.length;
      document.getElementById('charNoSpaceCount').innerText = texto.replace(/\s/g, '').length;
      
      const palavras = texto.trim() === '' ? 0 : texto.trim().split(/\s+/).length;
      document.getElementById('wordCount').innerText = palavras;

      const segundos = Math.ceil((palavras / 200) * 60);
      document.getElementById('readingTime').innerText = segundos < 60 ? segundos + "s" : (segundos / 60).toFixed(1) + "m";
    }

    function converterMaiusculas() { textInput.value = textInput.value.toUpperCase(); atualizarEstatisticas(); }
    function converterMinusculas() { textInput.value = textInput.value.toLowerCase(); atualizarEstatisticas(); }
    function limparTexto() { textInput.value = ''; atualizarEstatisticas(); }
    
    function copiarTexto() {
      if (!textInput.value) return alert('Digite ou cole algum texto para copiar!');
      textInput.select();
      textInput.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        alert('Texto copiado com sucesso!');
      } catch (err) {
        navigator.clipboard.writeText(textInput.value);
        alert('Texto copiado com sucesso!');
      }
      window.open(directLink, '_blank');
    }

    function alternarTipoQR() {
      const tipo = document.getElementById('qrType').value;
      if (tipo === 'pix') {
        document.getElementById('campoLink').style.display = 'none';
        document.getElementById('campoPix').style.display = 'block';
      } else {
        document.getElementById('campoLink').style.display = 'block';
        document.getElementById('campoPix').style.display = 'none';
      }
      gerarQRCode();
    }

    // Função para formatar Payload do PIX no padrão do Banco Central (BR Code)
    function gerarPayloadPix(chave, nome, cidade) {
      chave = chave.trim().replace(/\s+/g, '');
      nome = nome.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase() || "RECEBEDOR";
      cidade = cidade.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase() || "SAO PAULO";

      if (nome.length > 25) nome = nome.substring(0, 25);
      if (cidade.length > 15) cidade = cidade.substring(0, 15);

      function formatField(id, value) {
        const len = value.length.toString().padStart(2, '0');
        return id + len + value;
      }

      const merchantAccountInfo = formatField('00', 'br.gov.bcb.pix') + formatField('01', chave);
      
      let payload = formatField('00', '01') +
                    formatField('26', merchantAccountInfo) +
                    formatField('52', '0000') +
                    formatField('53', '986') +
                    formatField('58', 'BR') +
                    formatField('59', nome) +
                    formatField('60', cidade) +
                    formatField('62', formatField('05', '***')) +
                    '6304';

      // Cálculo do CRC16
      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= (payload.charCodeAt(i) << 8);
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) {
            crc = (crc << 1) ^ 0x1021;
          } else {
            crc = (crc << 1);
          }
        }
      }
      let crcHex = (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');

      return payload + crcHex;
    }

    let qrObj = null;
    function gerarQRCode() {
      const tipo = document.getElementById('qrType').value;
      let valorFinal = "";

      if (tipo === 'pix') {
        const chave = document.getElementById('pixKey').value;
        const nome = document.getElementById('pixName').value;
        const cidade = document.getElementById('pixCity').value;

        if (chave) {
          valorFinal = gerarPayloadPix(chave, nome, cidade);
        } else {
          valorFinal = "Aguardando chave PIX...";
        }
      } else {
        valorFinal = document.getElementById('qrInput').value.trim() || "https://google.com";
      }

      const qrDiv = document.getElementById('qrcode');
      qrDiv.innerHTML = "";

      qrObj = new QRCode(qrDiv, {
        text: valorFinal,
        width: 200,
        height: 200,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.M
      });
    }

    function baixarQRCode() {
      const canvas = document.querySelector('#qrcode canvas');
      const img = document.querySelector('#qrcode img');

      let imageSrc = "";
      if (canvas) {
        imageSrc = canvas.toDataURL("image/png");
      } else if (img && img.src) {
        imageSrc = img.src;
      }

      if (imageSrc) {
        const a = document.createElement('a');
        a.href = imageSrc;
        a.download = 'qrcode_pix.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        window.open(directLink, '_blank');
      } else {
        alert('Digite a chave PIX para gerar o código primeiro!');
      }
    }
  </script>

</body>
</html>
