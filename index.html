<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador e Editor de Legendas</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #1a73e8; margin-top: 0; }
    
    .ad-banner {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-decoration: none;
      display: block;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.16);
      transition: transform 0.2s;
    }
    .ad-banner:hover { transform: scale(1.02); }

    input[type="file"] { margin: 15px 0; padding: 10px; border: 1px solid #ccc; border-radius: 6px; width: 100%; max-width: 400px; }
    video { width: 100%; max-width: 600px; border-radius: 8px; margin-top: 15px; display: none; }
    
    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background-color: #1557b0; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gerador e Editor de Legendas</h1>
    <p>Envie o seu vídeo abaixo para começar a legendar gratuitamente!</p>

    <!-- BANNER DE ANÚNCIO (DIRECT LINK) -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner">
      🎁 Clique aqui para conferir ofertas exclusivas e apoiar o site grátis!
    </a>

    <input type="file" id="videoInput" accept="video/*">
    <br>
    <video id="videoPlayer" controls></video>

    <div style="margin-top: 20px;">
      <button class="btn" onclick="processarComAnuncio()">Processar Vídeo</button>
    </div>

    <!-- SEGUNDO BANNER NO RODAPÉ -->
    <a href="https://uplcm.com/4/11875710" target="_blank" class="ad-banner" style="background: linear-gradient(135deg, #4caf50, #388e3c); margin-top: 30px;">
      ⚡ Baixar Modelos de Legenda em Alta Resolução
    </a>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const videoPlayer = document.getElementById('videoPlayer');
    const directLink = "https://uplcm.com/4/11875710";

    videoInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        videoPlayer.src = fileURL;
        videoPlayer.style.display = 'block';
      }
    });

    function processarComAnuncio() {
      // Abre o Direct Link do Monetag em uma nova aba para contabilizar o clique
      window.open(directLink, '_blank');
      
      // Executa a função do site
      if (!videoInput.files[0]) {
        alert('Por favor, selecione um arquivo de vídeo primeiro!');
      } else {
        alert('Vídeo pronto para edição de legendas!');
      }
    }
  </script>

</body>
</html>
